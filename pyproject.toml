[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mlalpha"
version = "0.1.0"
description = "Cross sectional stock return prediction with purged walk-forward validation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Adrien Liao" }]
dependencies = ["numpy>=1.24", "pandas>=2.1", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["mlalpha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
